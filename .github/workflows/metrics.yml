name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Eski kartları sil
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f metrics.achievements.svg metrics.topics.svg metrics.habits.svg metrics.activity.svg metrics.people.svg metrics.stars.svg metrics.lines.svg
          git add -A
          git diff --staged --quiet || git commit -m "chore: eski kartları temizle"
          git pull --rebase --autostash
          git push

      - name: Ana kart
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          base: header
          config_timezone: Europe/Istanbul
          config_order: base.header, isocalendar, languages
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_details: percentage, lines
          plugin_languages_limit: 8
