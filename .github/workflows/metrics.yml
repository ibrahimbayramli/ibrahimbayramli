name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # ---------- Eski kartları temizle ----------
      - uses: actions/checkout@v4

      - name: Eski kartları sil
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f metrics.achievements.svg metrics.topics.svg
          git add -A
          git diff --staged --quiet || git commit -m "chore: eski kartları temizle"
          git pull --rebase --autostash
          git push

      # ---------- Ana kart ----------
      - name: Ana kart
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          base: header
          config_timezone: Europe/Istanbul
          config_order: base.header, isocalendar, languages

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_languages: yes
          plugin_languages_details: percentage, lines
          plugin_languages_limit: 8

      # ---------- Alışkanlıklar ----------
      - name: Alışkanlıklar
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.habits.svg
          base: ""
          config_timezone: Europe/Istanbul
          plugin_habits: yes
          plugin_habits_from: 500
          plugin_habits_days: 90
          plugin_habits_charts: yes
          plugin_habits_facts: yes

      # ---------- Satır istatistikleri ----------
      - name: Satır istatistikleri
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.lines.svg
          base: ""
          plugin_lines: yes

      # ---------- Takipçi duvarı ----------
      - name: İnsanlar
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.people.svg
          base: ""
          plugin_people: yes
          plugin_people_types: followers, following
          plugin_people_limit: 28
          plugin_people_size: 28

      # ---------- Yıldızladıkların ----------
      - name: Yıldızlar
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.stars.svg
          base: ""
          plugin_stars: yes
          plugin_stars_limit: 4

      # ---------- Aktivite akışı ----------
      - name: Aktivite
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.activity.svg
          base: ""
          config_timezone: Europe/Istanbul
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 0
          plugin_activity_filter: all
          plugin_activity_visibility: public
